name: Probe shadcn preset

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nextjs-foundation
    paths:
      - .github/workflows/shadcn-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nextjs-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Scaffold requested preset in a clean directory
        shell: bash
        run: |
          rm -rf /tmp/mk-shadcn
          mkdir -p /tmp/mk-shadcn
          cd /tmp/mk-shadcn
          pnpm dlx shadcn@latest init --preset bcivVKXQ --template next --name reference
      - name: Capture the preset contract
        shell: bash
        run: |
          rm -rf .shadcn-reference
          mkdir -p .shadcn-reference/app .shadcn-reference/lib
          ROOT="$(find /tmp/mk-shadcn -name components.json -print -quit | xargs dirname)"
          echo "Reference root: $ROOT"
          cp "$ROOT/components.json" .shadcn-reference/components.json
          cp "$ROOT/package.json" .shadcn-reference/package.json
          cp "$ROOT/app/globals.css" .shadcn-reference/app/globals.css
          cp "$ROOT/app/layout.tsx" .shadcn-reference/app/layout.tsx
          cp "$ROOT/postcss.config.mjs" .shadcn-reference/postcss.config.mjs
          cp "$ROOT/lib/utils.ts" .shadcn-reference/lib/utils.ts
          if [ -f "$ROOT/pnpm-lock.yaml" ]; then cp "$ROOT/pnpm-lock.yaml" .shadcn-reference/pnpm-lock.yaml; fi
      - name: Commit reference scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .shadcn-reference
          if git diff --cached --quiet; then
            echo "No reference changes"
          else
            git commit -m "Capture shadcn preset reference"
            git push origin HEAD:agent/nextjs-foundation
          fi
